{% extends "base_public.html" %}
{% block content %}
<section class="card authcard">
  <h1>Create student account</h1>
  <form method="post">
    <label>Full name<input name="name" required></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Password (minimum 8 characters)<input type="password" name="password" minlength="8" required></label>
    <label>Room number<input name="room" placeholder="e.g. B-204"></label>
    <label>Parent phone (optional)<input name="parent_phone" type="tel"></label>
    <button class="btn">Create account</button>
  </form>
</section>
{% endblock %}
